<text x="515" y="479" class="detail" >Line matching + wheel / simulated odometry</text>
<text x="515" y="496" class="detail" >Uses /raw_map + /line_segments + /odom</text>
<rect x="500" y="556" width="320" height="88" rx="8" class="card"/><path d="M501 568 V632" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>
