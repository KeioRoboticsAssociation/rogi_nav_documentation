<text x="515" y="601" class="detail" >Alternative localization method</text>
<text x="515" y="618" class="detail" >Uses /map + laser scan + odometry TF</text>
<text x="515" y="635" class="detail" >Sim scan input: scan_frame_normalizer</text>
<text x="660" y="359" class="mono" text-anchor="middle">localization_method: ransac | emcl2</text>
