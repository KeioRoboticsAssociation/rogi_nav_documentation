<text x="83" y="479" class="detail" >RANSAC line extraction</text>
<text x="83" y="496" class="detail" >rogi_ransac</text>
<rect x="68" y="556" width="320" height="88" rx="8" class="card"/><path d="M69 568 V632" stroke="var(--green)" stroke-width="4" stroke-linecap="round"/>
