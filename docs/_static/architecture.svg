<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" role="img" aria-labelledby="title desc">
<title id="title">rogi_nav architecture</title>
<desc id="desc">ROS 2 navigation stack. A BehaviorTree.CPP state node sends FollowPath goals to simple_pure_pursuit. RANSAC or EMCL2 supplies localization. Velocity commands drive Gazebo or real motor interfaces. CSV files supply maps and trajectories. See architecture.md for configuration and source references.</desc>
<style>
:root { --bg:#ffffff; --fg:#1f2937; --muted:#667085; --border:#d8dee7; --panel:#f6f8fb; --card:#ffffff; --green:#218653; --blue:#2675cd; --purple:#8754c8; --orange:#bd651e; --gray:#788392; }
@media(prefers-color-scheme:dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9ca9b9; --border:#303c4b; --panel:#131a23; --card:#18212d; --green:#56c58c; --blue:#6bafff; --purple:#bd97f3; --orange:#f1ad68; --gray:#a5b0bf; } }
text { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:var(--fg); }
.title { font-size:28px; font-weight:750; } .subtitle { font-size:14px; fill:var(--muted); }
.group { font-size:12px; font-weight:750; letter-spacing:1.5px; }
.name { font-size:16px; font-weight:650; } .detail { font-size:12px; fill:var(--muted); }
.label { font-size:11px; fill:var(--muted); } .mono { font-family:ui-monospace,"DejaVu Sans Mono",monospace; font-size:12px; }
.panel { fill:var(--panel); stroke:var(--border); } .card { fill:var(--card); stroke:var(--border); }
.edge { fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
.pulse { fill:none; stroke-width:3; stroke-dasharray:7 93; stroke-linecap:round; animation:flow 4s linear infinite; opacity:.9; }
@keyframes flow { to { stroke-dashoffset:-100; } }
@media(prefers-reduced-motion:reduce) { .pulse { display:none; } }
</style><defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--green)"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--blue)"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--purple)"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--orange)"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--gray)"/></marker>
</defs><rect width="1320" height="1030" fill="var(--bg)"/>
<text x="48" y="47" class="title" >rogi_nav</text>
<text x="210" y="45" class="subtitle" >ROS 2 navigation  /  sensing, localization and behavior-driven path following</text>
<rect x="48" y="78" width="1224" height="70" rx="12" class="panel"/>
<text x="68" y="103" class="group" >BRINGUP</text>
<text x="68" y="128" class="mono" >rogi_launch / rogi_nav.launch.py</text>
<text x="530" y="103" class="mono" >example/&lt;name&gt;/config</text>
<text x="530" y="128" class="detail" >real.yaml / sim.yaml  +  initial_pose.yaml  +  component settings</text>
<text x="1110" y="103" class="name" >ROS 2 Jazzy</text>
<text x="1110" y="128" class="detail" >Gazebo Harmonic</text>
